name: pipeline
on:
  push:
   branches:
    - main
    - feature/sample
  pull_request:
   branches:
     - main
     - feature/sample
  workflow_dispatch:
   branches:
     - main
     - feature/sample
   inputs:
     deploy_env:
     description: 'target env'
     required: true
     type: choice
     options: 
      - dev 
      - stg 
     default: dev
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml



                
